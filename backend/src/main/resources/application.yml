spring:
  application:
    name: chords
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/chords}
    username: ${DB_USERNAME:chords}
    password: ${DB_PASSWORD:chords}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
